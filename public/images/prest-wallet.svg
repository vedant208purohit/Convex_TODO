<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" fill="none">
  <defs>
    <!-- Ambient Glow & Shadows -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14100E" flood-opacity="0.18" />
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="leatherBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="50%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#0C0A09" />
    </linearGradient>

    <linearGradient id="leatherFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383230" />
      <stop offset="40%" stop-color="#24201E" />
      <stop offset="100%" stop-color="#141110" />
    </linearGradient>

    <linearGradient id="leatherFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#443D3A" />
      <stop offset="70%" stop-color="#24201E" />
      <stop offset="100%" stop-color="#171413" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="60%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <linearGradient id="ambientGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Light Halo Behind Wallet -->
  <ellipse cx="200" cy="170" rx="140" ry="85" fill="url(#ambientGlowGrad)" filter="url(#softGlow)" />

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="275" rx="125" ry="18" fill="#14100E" opacity="0.16" filter="url(#softGlow)" />

  <!-- Group with Drop Shadow -->
  <g filter="url(#dropShadow)">

    <!-- WALLET BACK SHELL -->
    <rect x="75" y="115" width="250" height="145" rx="28" fill="url(#leatherBack)" stroke="#524741" stroke-width="1.5" />

    <!-- GOLD STITCHING ON BACK -->
    <rect x="83" y="123" width="234" height="129" rx="22" fill="none" stroke="#D9911E" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 3" />

    <!-- INSERTED PREMIUM CARD 1 (Angled Gold Trim Card) -->
    <g transform="translate(135, 75) rotate(-9)" filter="url(#cardShadow)">
      <rect width="138" height="92" rx="12" fill="url(#cardGrad)" stroke="#EAB308" stroke-width="1.2" stroke-opacity="0.65" />
      <!-- Chip -->
      <rect x="18" y="24" width="22" height="18" rx="4" fill="url(#goldGradient)" />
      <!-- Card lines -->
      <line x1="18" y1="56" x2="68" y2="56" stroke="#A1A1AA" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <line x1="18" y1="66" x2="48" y2="66" stroke="#71717A" stroke-width="2" stroke-linecap="round" opacity="0.5" />
      <!-- Logo P -->
      <circle cx="114" cy="28" r="10" fill="url(#goldGradient)" opacity="0.85" />
      <text x="114" y="32" font-family="'EB Garamond', serif" font-size="11" font-weight="bold" fill="#181818" text-anchor="middle">P</text>
    </g>

    <!-- INSERTED FLOATING ESCROW GOLD COIN -->
    <g transform="translate(268, 92)" filter="url(#cardShadow)">
      <circle cx="26" cy="26" r="26" fill="url(#goldGradient)" stroke="#FEF08A" stroke-width="1.5" />
      <circle cx="26" cy="26" r="21" fill="none" stroke="#78350F" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 2" />
      <text x="26" y="34" font-family="'EB Garamond', serif" font-size="24" font-weight="bold" fill="#78350F" text-anchor="middle">₹</text>
    </g>

    <!-- WALLET FRONT MAIN POCKET -->
    <rect x="75" y="145" width="250" height="120" rx="26" fill="url(#leatherFront)" stroke="#574C46" stroke-width="1.5" />

    <!-- GOLD STITCHING ON FRONT -->
    <rect x="83" y="153" width="234" height="104" rx="20" fill="none" stroke="#D9911E" stroke-opacity="0.4" stroke-width="1" stroke-dasharray="4 3" />

    <!-- CURVED LEATHER FLAP OVERLAY -->
    <path d="M 75 160 C 140 185, 260 185, 325 160 L 325 240 C 325 255, 310 265, 295 265 L 105 265 C 90 265, 75 255, 75 240 Z" fill="url(#leatherFlap)" stroke="#4A413D" stroke-width="1" />

    <!-- GOLD EMBOSSED BADGE / CLASP -->
    <g transform="translate(182, 185)">
      <!-- Clasp Body -->
      <rect x="0" y="0" width="36" height="30" rx="8" fill="url(#goldGradient)" stroke="#FEF08A" stroke-width="1" />
      <circle cx="18" cy="15" r="5" fill="#78350F" opacity="0.8" />
      <circle cx="18" cy="15" r="2" fill="#FEF08A" />
    </g>

    <!-- PREST SUBTLE ENGRAVING ON LEATHER -->
    <text x="200" y="244" font-family="'Inter', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#D9911E" fill-opacity="0.55" text-anchor="middle">
      PREST WALLET
    </text>
  </g>

  <!-- Sparkles & Escrow Accent Dots -->
  <circle cx="118" cy="100" r="2.5" fill="#F59E0B" opacity="0.85" filter="url(#softGlow)" />
  <circle cx="295" cy="80" r="2" fill="#FCD34D" opacity="0.9" />
  <circle cx="340" cy="140" r="3" fill="#F59E0B" opacity="0.75" filter="url(#softGlow)" />
  <path d="M 100 80 L 103 86 L 109 89 L 103 92 L 100 98 L 97 92 L 91 89 L 97 86 Z" fill="#F59E0B" opacity="0.8" />
  <path d="M 315 110 L 317 114 L 321 116 L 317 118 L 315 122 L 313 118 L 309 116 L 313 114 Z" fill="#FCD34D" opacity="0.9" />
</svg>
